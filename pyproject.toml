[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hot-trigger"
version = "0.1.0"
description = "Protocol-first event driven trend trigger system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "httpx>=0.27,<1"
]

[project.scripts]
hot-trigger = "hot_trigger.cli:main"

[tool.setuptools.packages.find]
include = ["hot_trigger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
